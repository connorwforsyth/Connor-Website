name: CV PDF

on:
  push:
    branches: [main]
    paths:
      - "app/(cv)/**"
      - "components/PrintButton.tsx"
      - "styles/cv-globals.css"
      - "styles/type.css"
      - "public/fonts/**"
      - "scripts/generate-cv-pdf.ts"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run cv:pdf
        env:
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
      - name: Commit regenerated PDF
        run: |
          if git diff --quiet -- public/connor-forsyth-cv.pdf; then
            echo "CV PDF unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/connor-forsyth-cv.pdf
          git commit -m "chore: regenerate CV PDF [skip ci]"
          git push
